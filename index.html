<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOHAKORA PRO MAX</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0d1117;
  --card:#161b22;
  --text:#f0f6fc;
  --red:#ff3b3b;
  --green:#2ecc71;
}

body{
  margin:0;
  font-family:Cairo;
  background:var(--bg);
  color:var(--text);
}

header{
  padding:18px;
  text-align:center;
  font-size:22px;
  font-weight:900;
  background:#010409;
  border-bottom:2px solid var(--red);
}

.tabs{
  display:flex;
  overflow-x:auto;
  gap:10px;
  padding:10px;
}

.tab{
  padding:8px 14px;
  background:#21262d;
  border:1px solid #30363d;
  border-radius:20px;
  cursor:pointer;
  white-space:nowrap;
}

.tab.active{
  background:var(--red);
}

.box{
  margin:10px;
  padding:12px;
  background:var(--card);
  border-radius:12px;
  border:1px solid #30363d;
}

.item{
  padding:10px;
  border-bottom:1px solid #30363d;
}

.row{
  display:flex;
  justify-content:space-between;
  font-weight:900;
}

.small{
  font-size:12px;
  color:#aaa;
}
</style>
</head>

<body>

<header>⚽ MOHAKORA PRO MAX</header>

<div class="tabs">
  <div class="tab active" onclick="setLeague('PL')">🇬🇧 PL</div>
  <div class="tab" onclick="setLeague('PD')">🇪🇸 PD</div>
  <div class="tab" onclick="setLeague('SA')">🇮🇹 SA</div>
  <div class="tab" onclick="setLeague('BL1')">🇩🇪 BL1</div>
  <div class="tab" onclick="setLeague('FL1')">🇫🇷 FL1</div>
</div>

<div id="matches" class="box">جاري تحميل المباريات...</div>
<div id="table" class="box">جاري تحميل الترتيب...</div>

<script>
const API_KEY = "PUT_YOUR_API_KEY_HERE";

let league = "PL";

/* 🔥 API CORE */
async function fetchAPI(url){
  const res = await fetch("https://api.football-data.org/v4" + url, {
    headers: { "X-Auth-Token": API_KEY }
  });

  if(!res.ok){
    throw new Error("API ERROR " + res.status);
  }

  return await res.json();
}

/* 🏟️ MATCHES */
async function loadMatches(){
  const div = document.getElementById("matches");
  div.innerHTML = "جاري تحميل المباريات...";

  try{
    const data = await fetchAPI(`/competitions/${league}/matches`);

    const matches = data.matches.slice(0, 10);

    div.innerHTML = "<h3>🏟️ المباريات</h3>" +
    matches.map(m => `
      <div class="item">
        <div class="small">${m.utcDate}</div>
        <div class="row">
          <span>${m.homeTeam.name}</span>
          <span>${m.score.fullTime.home ?? 0} - ${m.score.fullTime.away ?? 0}</span>
          <span>${m.awayTeam.name}</span>
        </div>
      </div>
    `).join("");

  }catch(e){
    div.innerHTML = "خطأ في تحميل المباريات ⚠️";
  }
}

/* 📊 STANDINGS */
async function loadTable(){
  const div = document.getElementById("table");
  div.innerHTML = "جاري تحميل الترتيب...";

  try{
    const data = await fetchAPI(`/competitions/${league}/standings`);

    const table = data.standings[0].table;

    div.innerHTML = "<h3>📊 الترتيب</h3>" +
    table.map((t,i)=>`
      <div class="item">
        <div class="row">
          <span>${i+1}. ${t.team.name}</span>
          <span style="color:var(--green)">${t.points} pt</span>
        </div>
      </div>
    `).join("");

  }catch(e){
    div.innerHTML = "خطأ في تحميل الترتيب ⚠️";
  }
}

/* 🔁 SWITCH LEAGUE */
function setLeague(l){
  league = l;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  event.target.classList.add('active');

  loadMatches();
  loadTable();
}

loadMatches();
loadTable();
</script>

</body>
</html>
