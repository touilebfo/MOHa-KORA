<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOHaKORA PRO</title>
    <style>
        body { background-color: #070b18; color: white; font-family: sans-serif; text-align: center; padding: 20px; margin: 0; }
        .header { font-size: 28px; color: #ff2d2d; font-weight: bold; padding: 20px; border-bottom: 2px solid #ff2d2d; margin-bottom: 20px; }
        .match-card { background: #161e2e; padding: 15px; border-radius: 12px; margin: 10px auto; max-width: 450px; border: 1px solid #2d3748; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .league { font-size: 12px; color: #888; margin-bottom: 8px; }
        .score { font-size: 22px; color: #00ff99; font-weight: bold; }
        .loading { color: #ff2d2d; font-size: 18px; margin-top: 50px; }
    </style>
</head>
<body>
    <div class="header">⚽ MOHaKORA PRO</div>
    <div id="content"><div class="loading">جاري تحديث النتائج المباشرة...</div></div>

    <script>
        const API_KEY = '61691e4b6b644580a8a3483b4261a07b';
        // الرابط مع الوسيط لتخطي الحجب
        const URL = 'https://api.allorigins.win/get?url=' + encodeURIComponent('https://api.football-data.org/v4/matches');

        async function getMatches() {
            try {
                const response = await fetch(URL);
                const result = await response.json();
                // فك تشفير البيانات القادمة من الوسيط
                const data = JSON.parse(result.contents);
                
                const container = document.getElementById('content');
                
                if (data.matches && data.matches.length > 0) {
                    container.innerHTML = data.matches.map(m => `
                        <div class="match-card">
                            <div class="league">${m.competition.name}</div>
                            <div style="display:flex; justify-content:space-around; align-items:center;">
                                <span>${m.homeTeam.shortName}</span>
                                <span class="score">${m.score.fullTime.home ?? 0} - ${m.score.fullTime.away ?? 0}</span>
                                <span>${m.awayTeam.shortName}</span>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = "<p>لا توجد مباريات جارية حالياً.</p>";
                }
            } catch (error) {
                document.getElementById('content').innerHTML = "<p>فشل في تحديث البيانات. حاول مرة أخرى.</p>";
            }
        }
        getMatches();
    </script>
</body>
</html>
