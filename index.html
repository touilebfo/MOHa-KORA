<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOHaKORA PRO V2</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0d1117;
  --card:#161b22;
  --text:#f0f6fc;
  --red:#ff3b3b;
  --green:#2ecc71;
}

body{
  margin:0;
  font-family:Cairo;
  background:var(--bg);
  color:var(--text);
}

header{
  text-align:center;
  padding:18px;
  font-size:22px;
  font-weight:900;
  background:#010409;
  border-bottom:2px solid var(--red);
}

.tabs{
  display:flex;
  overflow-x:auto;
  gap:10px;
  padding:10px;
}

.tab{
  padding:8px 14px;
  background:#21262d;
  border:1px solid #30363d;
  border-radius:20px;
  cursor:pointer;
  white-space:nowrap;
  font-weight:700;
}

.tab.active{
  background:var(--red);
}

.box{
  margin:10px;
  padding:12px;
  background:var(--card);
  border-radius:12px;
  border:1px solid #30363d;
}

.match{
  padding:10px;
  border-bottom:1px solid #30363d;
}

.score{
  font-size:20px;
  font-weight:900;
  color:var(--green);
  display:flex;
  justify-content:space-between;
}

.small{
  font-size:12px;
  color:#aaa;
}

</style>
</head>

<body>

<header>⚽ MOHAKORA PRO V2</header>

<div class="tabs">
  <div class="tab active" onclick="setLeague('germany')">🇩🇪 البوندسليغا</div>
  <div class="tab" onclick="setLeague('mock')">🌍 باقي الدوريات</div>
</div>

<div id="app" class="box">جاري التحميل...</div>

<script>
let league = "germany";

function setLeague(l){
  league = l;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  event.target.classList.add('active');
  load();
}

/* 🔥 API حقيقي بدون مفتاح */
async function loadGermany(){
  const res = await fetch("https://api.openligadb.de/getmatchdata/bl1/2024");
  const data = await res.json();

  return data.slice(0, 10).map(m => `
    <div class="match">
      <div class="small">${m.matchDateTime}</div>
      <div class="score">
        <span>${m.team1.teamName}</span>
        <span>${m.matchResults?.slice(-1)[0]?.pointsTeam1 ?? 0} - ${m.matchResults?.slice(-1)[0]?.pointsTeam2 ?? 0}</span>
        <span>${m.team2.teamName}</span>
      </div>
    </div>
  `).join("");
}

/* 🌍 بيانات تجريبية لباقي الدوريات */
function loadMock(){
  return `
    <div class="match">
      <div class="small">API غير متاح مجاناً لهذه الدوريات</div>
      <div class="score">
        <span>Team A</span>
        <span>0 - 0</span>
        <span>Team B</span>
      </div>
    </div>
    <div class="match">
      <div class="small">اربط API احترافي لاحقاً</div>
      <div class="score">
        <span>Team C</span>
        <span>1 - 2</span>
        <span>Team D</span>
      </div>
    </div>
  `;
}

async function load(){
  const app = document.getElementById("app");
  app.innerHTML = "جاري التحميل...";

  try{
    if(league === "germany"){
      app.innerHTML = await loadGermany();
    } else {
      app.innerHTML = loadMock();
    }
  } catch(e){
    app.innerHTML = "خطأ في تحميل البيانات ⚠️";
  }
}

load();
</script>

</body>
</html>
