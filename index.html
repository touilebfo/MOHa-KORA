<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOHaKORA PRO | النسخة الاحترافية</title>
    <style>
        :root { --bg: #050810; --card: #111827; --primary: #ff3b3b; --accent: #00ff88; --text: #ffffff; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; padding-bottom: 80px; }
        
        /* الهيدر */
        header { background: #0f172a; padding: 15px; text-align: center; border-bottom: 2px solid var(--primary); position: sticky; top: 0; z-index: 100; }
        
        /* أزرار التبديل بين الدوريات */
        .leagues-nav { display: flex; overflow-x: auto; padding: 10px; gap: 10px; background: #0c111d; }
        .league-btn { background: #1f2937; color: #9ca3af; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-size: 12px; }
        .league-btn.active { background: var(--primary); color: white; }

        .container { max-width: 500px; margin: auto; padding: 10px; }
        
        /* تصميم المباريات */
        .section-title { font-size: 16px; margin: 15px 0 10px; border-right: 4px solid var(--primary); padding-right: 10px; color: var(--primary); }
        .match-card { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 10px; border: 1px solid #1f2937; }
        .flex-row { display: flex; justify-content: space-between; align-items: center; }
        .score { font-size: 22px; font-weight: bold; color: var(--accent); background: #000; padding: 5px 12px; border-radius: 8px; }
        
        /* تصميم الهدافين */
        .scorer-card { background: #0f172a; display: flex; justify-content: space-between; padding: 10px 15px; border-radius: 8px; margin-bottom: 5px; align-items: center; }
        .rank { color: var(--primary); font-weight: bold; margin-left: 10px; }
        .goals { color: var(--accent); font-weight: bold; }

        /* شريط التنقل السفلي */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #0f172a; display: flex; border-top: 1px solid #1f2937; }
        .nav-tab { flex: 1; text-align: center; padding: 15px; color: #6b7280; cursor: pointer; font-size: 14px; }
        .nav-tab.active { color: var(--primary); border-top: 3px solid var(--primary); background: #111827; }

        .hidden { display: none; }
    </style>
</head>
<body>

<header>⚽ MOHaKORA PRO</header>

<div class="leagues-nav" id="leagues-bar">
    <button class="league-btn active" onclick="changeLeague('PL', this)">الدوري الإنجليزي</button>
    <button class="league-btn" onclick="changeLeague('PD', this)">الدوري الإسباني</button>
    <button class="league-btn" onclick="changeLeague('SA', this)">الدوري الإيطالي</button>
    <button class="league-btn" onclick="changeLeague('BL1', this)">الدوري الألماني</button>
    <button class="league-btn" onclick="changeLeague('FL1', this)">الدوري الفرنسي</button>
</div>

<div class="container" id="matches-page">
    <div class="section-title">مباريات اليوم (المنتهية والجارية)</div>
    <div id="matches-list">جاري التحميل...</div>
</div>

<div class="container hidden" id="scorers-page">
    <div class="section-title">قائمة الهدافين</div>
    <div id="scorers-list">جاري التحميل...</div>
</div>

<nav class="bottom-nav">
    <div class="nav-tab active" onclick="switchTab('matches', this)">المباريات</div>
    <div class="nav-tab" onclick="switchTab('scorers', this)">الهدافين</div>
</nav>

<script>
    const API_KEY = '61691e4b6b644580a8a3483b4261a07b';
    const PROXY = 'https://api.allorigins.win/get?url=';
    let currentLeague = 'PL';

    function switchTab(tab, el) {
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        if(tab === 'matches') {
            document.getElementById('matches-page').classList.remove('hidden');
            document.getElementById('scorers-page').classList.add('hidden');
            loadMatches();
        } else {
            document.getElementById('matches-page').classList.add('hidden');
            document.getElementById('scorers-page').classList.remove('hidden');
            loadScorers();
        }
    }

    function changeLeague(code, el) {
        document.querySelectorAll('.league-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        currentLeague = code;
        loadMatches();
        loadScorers();
    }

    async function loadMatches() {
        const url = `${PROXY}${encodeURIComponent(`https://api.football-data.org/v4/competitions/${currentLeague}/matches`)}`;
        try {
            const res = await fetch(url);
            const data = JSON.parse((await res.json()).contents);
            // تصفية مباريات اليوم فقط
            const today = new Date().toISOString().split('T')[0];
            const matches = data.matches.filter(m => m.utcDate.includes(today));
            
            const list = document.getElementById('matches-list');
            if(matches.length === 0) {
                list.innerHTML = "<p style='text-align:center; padding:20px;'>لا توجد مباريات لهذا الدوري اليوم.</p>";
                return;
            }

            list.innerHTML = matches.map(m => `
                <div class="match-card">
                    <div class="flex-row">
                        <div style="flex:1; text-align:center;">${m.homeTeam.shortName}</div>
                        <div style="flex:1; text-align:center;">
                            <div class="score">${m.score.fullTime.home ?? 0} - ${m.score.fullTime.away ?? 0}</div>
                            <div style="font-size:10px; margin-top:5px; color:${m.status === 'FINISHED' ? '#ff3b3b' : '#00ff88'}">
                                ${m.status === 'FINISHED' ? 'منتهية' : 'مباشر/قادمة'}
                            </div>
                        </div>
                        <div style="flex:1; text-align:center;">${m.awayTeam.shortName}</div>
                    </div>
                </div>
            `).join('');
        } catch (e) { console.error(e); }
    }

    async function loadScorers() {
        const url = `${PROXY}${encodeURIComponent(`https://api.football-data.org/v4/competitions/${currentLeague}/scorers`)}`;
        try {
            const res = await fetch(url);
            const data = JSON.parse((await res.json()).contents);
            const list = document.getElementById('scorers-list');
            
            list.innerHTML = data.scorers.map((s, i) => `
                <div class="scorer-card">
                    <div>
                        <span class="rank">${i+1}</span>
                        <span>${s.player.name}</span>
                        <div style="font-size:10px; color:#666; margin-right:25px;">${s.team.name}</div>
                    </div>
                    <div class="goals">${s.goals} ⚽</div>
                </div>
            `).join('');
        } catch (e) { console.error(e); }
    }

    // التشغيل الافتراضي
    loadMatches();
</script>

</body>
</html>
