<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOHaKORA PRO MAX</title>

<style>
:root{
--bg:#0a0f1f;
--card:#141c2f;
--primary:#ff2d55;
--accent:#00ff9d;
--text:#fff;
}

body{
margin:0;
font-family:Arial;
background:var(--bg);
color:var(--text);
padding-bottom:80px;
}

header{
text-align:center;
padding:15px;
font-size:18px;
font-weight:bold;
background:#0f172a;
border-bottom:2px solid var(--primary);
position:sticky;
top:0;
}

.topbar{
display:flex;
overflow-x:auto;
gap:10px;
padding:10px;
background:#0c1222;
}

.btn{
padding:8px 15px;
border-radius:20px;
background:#1f2937;
cursor:pointer;
white-space:nowrap;
font-size:12px;
transition:0.3s;
}

.btn.active{
background:var(--primary);
}

.container{
max-width:500px;
margin:auto;
padding:10px;
}

.card{
background:var(--card);
padding:15px;
border-radius:14px;
margin-bottom:10px;
box-shadow:0 5px 20px rgba(0,0,0,0.3);
}

.row{
display:flex;
justify-content:space-between;
align-items:center;
}

.team{
flex:1;
text-align:center;
font-weight:bold;
}

.score{
color:var(--accent);
font-size:20px;
font-weight:bold;
background:#000;
padding:5px 10px;
border-radius:8px;
}

.status{
font-size:11px;
margin-top:6px;
opacity:0.8;
}

.bottom{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:#0f172a;
border-top:1px solid #1f2937;
}

.bottom div{
flex:1;
text-align:center;
padding:15px;
cursor:pointer;
}

.bottom .active{
color:var(--primary);
border-top:3px solid var(--primary);
background:#111827;
}
</style>
</head>

<body>

<header>⚽ MOHaKORA PRO MAX (LIVE)</header>

<div class="topbar">
<div class="btn active" onclick="setLeague(4328,this)">إنجلترا</div>
<div class="btn" onclick="setLeague(4335,this)">إسبانيا</div>
<div class="btn" onclick="setLeague(4332,this)">إيطاليا</div>
<div class="btn" onclick="setLeague(4331,this)">ألمانيا</div>
</div>

<div class="container" id="content">جاري التحميل...</div>

<div class="bottom">
<div class="active" onclick="showMatches(this)">⚽ المباريات</div>
<div onclick="showScorers(this)">🏆 الهدافين</div>
</div>

<script>

let leagueId = 4328;
let mode = "matches";

// 🔥 تحديث تلقائي كل 30 ثانية
setInterval(() => {
if(mode === "matches") loadMatches();
else loadScorers();
}, 30000);

// ================== مباريات ==================
async function loadMatches(){
mode="matches";

const res = await fetch(`https://www.thesportsdb.com/api/v1/json/3/eventsnextleague.php?id=${leagueId}`);
const data = await res.json();

const box = document.getElementById("content");

if(!data.events){
box.innerHTML = "لا توجد مباريات حالياً";
return;
}

box.innerHTML = data.events.map(m => `
<div class="card">
<div class="row">
<div class="team">${m.strHomeTeam}</div>

<div>
<div class="score">${m.intHomeScore ?? 0} - ${m.intAwayScore ?? 0}</div>
<div class="status">${m.strStatus || "قادم"}</div>
</div>

<div class="team">${m.strAwayTeam}</div>
</div>

<div style="text-align:center;font-size:11px;opacity:0.6;margin-top:5px">
📅 ${m.dateEvent} ⏰ ${m.strTime}
</div>
</div>
`).join("");
}

// ================== هدافين ==================
async function loadScorers(){
mode="scorers";

const res = await fetch(`https://www.thesportsdb.com/api/v1/json/3/lookuptopscorers.php?id=${leagueId}`);
const data = await res.json();

const box = document.getElementById("content");

if(!data.scorers){
box.innerHTML = "لا توجد بيانات هدافين";
return;
}

box.innerHTML = data.scorers.map((s,i)=>`
<div class="card">
<div class="row">
<div>${i+1}. ${s.strPlayer}</div>
<div class="score">${s.intGoals} ⚽</div>
</div>
<div style="font-size:12px;opacity:0.7">${s.strTeam}</div>
</div>
`).join("");
}

// ================== تغيير الدوري ==================
function setLeague(id,el){
leagueId = id;

document.querySelectorAll(".btn").forEach(b=>b.classList.remove("active"));
el.classList.add("active");

loadMatches();
}

// ================== التبديل ==================
function showMatches(el){
document.querySelectorAll(".bottom div").forEach(b=>b.classList.remove("active"));
el.classList.add("active");
loadMatches();
}

function showScorers(el){
document.querySelectorAll(".bottom div").forEach(b=>b.classList.remove("active"));
el.classList.add("active");
loadScorers();
}

// تشغيل أولي
loadMatches();

</script>

</body>
</html>
