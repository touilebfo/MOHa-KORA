<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOHaKORA PRO | الدوريات الكبرى</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ff2d2d; --bg: #070b18; --card: #161e2e; --accent: #00ff99; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); color: white; padding-bottom: 50px; }
        header { padding: 20px; text-align: center; background: #0f172a; border-bottom: 3px solid var(--primary); }
        .nav-tabs { display: flex; justify-content: center; background: #111827; padding: 10px; position: sticky; top: 0; z-index: 100; overflow-x: auto; }
        .tab { padding: 10px 20px; margin: 0 5px; border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.3s; background: rgba(255,255,255,0.05); white-space: nowrap; }
        .tab.active { background: var(--primary); }
        .selector-container { text-align: center; margin: 20px 0; }
        select { padding: 10px; border-radius: 10px; background: var(--card); color: white; border: 1px solid var(--primary); font-family: 'Cairo'; width: 220px; outline: none; }
        .container { max-width: 800px; margin: auto; padding: 0 15px; }
        .card { background: var(--card); border-radius: 18px; padding: 20px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
        table { width: 100%; border-collapse: collapse; }
        td, th { padding: 12px; text-align: right; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .team-img { width: 25px; height: 25px; vertical-align: middle; margin-left: 10px; }
        .badge { background: #070b18; padding: 5px 10px; border-radius: 8px; color: var(--accent); font-weight: bold; }
        .loading { text-align: center; padding: 40px; color: var(--primary); font-weight: bold; }
    </style>
</head>
<body>
<header><div style="font-size: 24px; font-weight: 900;">MOHaKORA <span style="color: var(--primary);">PRO</span> ⚽</div></header>
<div class="nav-tabs">
    <div class="tab active" onclick="changeMode('matches')">⚽ مباريات اليوم</div>
    <div class="tab" onclick="changeMode('standings')">🏆 الترتيب</div>
    <div class="tab" onclick="changeMode('scorers')">🔥 الهدافين</div>
</div>
<div class="selector-container" id="league-selector" style="display:none;">
    <select id="league-id" onchange="refreshContent()">
        <option value="PL">🏴󠁧󠁢󠁥󠁮󠁧󠁿 الدوري الإنجليزي</option>
        <option value="PD">🇪🇸 الدوري الإسباني</option>
        <option value="BL1">🇩🇪 الدوري الألماني</option>
        <option value="SA">🇮🇹 الدوري الإيطالي</option>
        <option value="FL1">🇫🇷 الدوري الفرنسي</option>
    </select>
</div>
<div class="container" id="main-content"></div>
<script>
    const API_KEY = '61691e4b6b644580a8a3483b4261a07b';
    const BASE_URL = 'https://api.football-data.org/v4';
    let currentMode = 'matches';
    async function fetchData(endpoint) {
        document.getElementById('main-content').innerHTML = '<div class="loading">جاري تحديث البيانات...</div>';
        try {
            const response = await fetch(`${BASE_URL}/${endpoint}`, { headers: { 'X-Auth-Token': API_KEY } });
            return await response.json();
        } catch (e) { return null; }
    }
    function changeMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.currentTarget.classList.add('active');
        document.getElementById('league-selector').style.display = (mode === 'matches') ? 'none' : 'block';
        refreshContent();
    }
    async function refreshContent() {
        const league = document.getElementById('league-id').value;
        const box = document.getElementById('main-content');
        if (currentMode === 'matches') {
            const data = await fetchData('matches');
            if (!data || !data.matches.length) {
                box.innerHTML = '<div class="card" style="text-align:center">لا توجد مباريات حية حالياً.</div>';
                return;
            }
            box.innerHTML = data.matches.map(m => `
                <div class="card">
                    <div style="text-align:center; font-size:11px; color:#64748b; margin-bottom:10px">${m.competition.name}</div>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div style="flex:1; text-align:center"><img src="${m.homeTeam.crest}" width="35"><br>${m.homeTeam.shortName}</div>
                        <div style="flex:1; text-align:center; font-size:24px; font-weight:900; color:var(--accent)">${m.score.fullTime.home ?? 0} - ${m.score.fullTime.away ?? 0}</div>
                        <div style="flex:1; text-align:center"><img src="${m.awayTeam.crest}" width="35"><br>${m.awayTeam.shortName}</div>
                    </div>
                </div>`).join('');
        }
        if (currentMode === 'standings') {
            const data = await fetchData(`competitions/${league}/standings`);
            const table = data.standings[0].table;
            box.innerHTML = `<div class="card"><h3>🏆 جدول الترتيب</h3><table>${table.map(t => `<tr><td>${t.position}</td><td><img src="${t.team.crest}" class="team-img">${t.team.name}</td><td><span class="badge">${t.points} ن</span></td></tr>`).join('')}</table></div>`;
        }
        if (currentMode === 'scorers') {
            const data = await fetchData(`competitions/${league}/scorers`);
            box.innerHTML = `<div class="card"><h3>🔥 قائمة الهدافين</h3><table>${data.scorers.map(s => `<tr><td>${s.player.name}</td><td style="color:#64748b; font-size:12px">${s.team.name}</td><td><span class="badge">${s.goals} هدف</span></td></tr>`).join('')}</table></div>`;
        }
    }
    refreshContent();
</script>
</body>
</html>
